# nginx.conf — Mac 2 (edge / reverse proxy / load balancer)
# Location on disk: /opt/homebrew/etc/nginx/nginx.conf
# Service: sudo brew services start nginx
# Certs referenced below are created by mkcert — see TLS_SETUP_NOTES.md

worker_processes 1;

events { worker_connections 1024; }

http {
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr ustatus=$upstream_status rt=$request_time';
    access_log /opt/homebrew/var/log/nginx/lb.log lb;
    error_log  /opt/homebrew/var/log/nginx/error.log;

    upstream backend_pool {
        # round-robin (default strategy — no extra directive needed)
        server 10.7.6.x:3001 max_fails=2 fail_timeout=5s;   # Backend A — Mac 3, replace 10.7.6.x
        server 10.7.6.x:3002 max_fails=2 fail_timeout=5s;   # Backend B — Mac 4, replace 10.7.6.x
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name app.parth.test api.parth.test;

        ssl_certificate     /opt/homebrew/etc/nginx/certs/app.pem;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout http_502;   # failover: skip a dead backend
        }
    }
}
